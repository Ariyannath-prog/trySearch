name: tests

# Every pull request and every push to main. The pull_request trigger is what
# makes this a required status check that can block a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run rather than queueing.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trysearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trysearch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Dockerfile (python:3.13-slim) and CLAUDE.md's stated version.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `python -m pytest`, not bare `pytest`: the module form puts the working
        # directory on sys.path, which is how tests/conftest.py finds the `app`
        # package. Bare `pytest` does not, and fails with ModuleNotFoundError.
        #
        # CI uses a disposable PostgreSQL service. It never connects to Supabase
        # or any other shared environment, and recorded fixtures keep provider
        # tests offline.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trysearch_test
        run: python -m pytest -q
