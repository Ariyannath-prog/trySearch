name: tests

# Every pull request and every push to main. The pull_request trigger is what
# makes this a required status check that can block a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run rather than queueing.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Dockerfile (python:3.13-slim) and CLAUDE.md's stated version.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `python -m pytest`, not bare `pytest`: the module form puts the working
        # directory on sys.path, which is how tests/conftest.py finds the `app`
        # package. Bare `pytest` does not, and fails with ModuleNotFoundError.
        #
        # No DATABASE_URL and no provider keys are set on purpose. The suite binds
        # in-memory SQLite in tests/conftest.py and replays recorded fixtures, so a
        # test that reaches for a real database or a paid API fails here.
        run: python -m pytest -q
