services:
  - type: web
    name: searchable-replica
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn --workers 2 --threads 4 --bind 0.0.0.0:$PORT server_pg:app
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_AGENT_PRESET
        value: low
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: openai/gpt-oss-120b:preferred
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
